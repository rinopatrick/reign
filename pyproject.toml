[project]
name = "reign"
version = "0.7.0"
description = "Local-first personal finance dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "reportlab>=4.2.0",
    "python-multipart>=0.0.17",
    "ofxparse>=0.21",
    "pywebpush>=2.5.0",
]

[project.scripts]
reign = "reign.__main__:main"
reign-desktop = "reign.desktop:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.24.0",
    "factory-boy>=3.3.0",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
    "playwright>=1.58.0",
    "pyinstaller>=6.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
fix = true
show-fixes = true
output-format = "grouped"
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg",
    ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants_d", ".pyenv",
    ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv",
    ".vscode", "__pypackages__", "_build", "buck-out", "build", "dist",
    "node_modules", "site-packages", "venv",
]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "S", "A", "C4", "T10", "SIM",
    "TCH", "ARG", "PTH", "ERA", "PL", "RUF", "PERF", "FBT",
]
ignore = ["E501", "S101", "COM812", "ISC001", "B008", "TC002", "TC003"]
# B008: FastAPI Depends()/File() in defaults is the official framework idiom.
# TC002/TC003: import-placement style only, zero runtime effect with
# `from __future__ import annotations` already in use.

[tool.ruff.lint.per-file-ignores]
# Tests only: pytest asserts, fixtures, magic numbers in test data are idiomatic.
# No src/ ignores — production code must be clean without waivers.
"tests/**/*" = ["S101", "SLF001", "ARG001", "PLR2004"]
# notify.py: S310 false positive — URL scheme is validated to http(s) via
# urllib.parse.urlsplit immediately before use; documented exception.
"src/reign/services/notify.py" = ["S310"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]
